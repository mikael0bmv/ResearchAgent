[project]
name = "provectus"
version = "0.1.0"
description = "Provectus Python project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langgraph",
    "langchain-core",
]

[project.scripts]
provectus = "provectus:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
